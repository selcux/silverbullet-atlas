name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'atlas.plug.js'
      - 'atlas.plug.js.map'
      - '**.md'
      - 'screenshots/**'
      - 'assets/**'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Commit built artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add atlas.plug.js atlas.plug.js.map
          git diff --staged --quiet || git commit -m "Build artifact [skip ci]"
          git push
