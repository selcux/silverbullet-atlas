name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Update PLUG.md version
        run: sed -i "s/^version: .*/version: $VERSION/" PLUG.md

      - name: Update package.json version
        run: npm version $VERSION --no-git-tag-version

      - run: npm run build

      - name: Commit version bump and artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PLUG.md package.json package-lock.json atlas.plug.js atlas.plug.js.map
          git commit -m "Release $VERSION [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: atlas.plug.js
